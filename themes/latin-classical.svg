<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .star { transform-box: fill-box; transform-origin: center; animation: star 4s ease-in-out infinite; }
    @keyframes star { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.75; } }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    .tw { animation: tw 4.4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 0.9; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#3E321A"/>
      <stop offset="1" stop-color="#FAF7EE"/>
    </linearGradient>
    <pattern id="meander" width="22" height="20" patternUnits="userSpaceOnUse">
      <path d="M1 19 V1 H21 V13 H9 V7 H15" fill="none" stroke="#C7922C" stroke-width="2"/>
      <path d="M1 19 H23" fill="none" stroke="#C7922C" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- meander band along the top, quiet like a frieze -->
  <rect x="0" y="8" width="1200" height="20" fill="url(#meander)" opacity="0.38"/>
  <line x1="0" y1="4" x2="1200" y2="4" stroke="#C7922C" stroke-width="1.2" opacity="0.4"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#C7922C" stroke-width="1.2" opacity="0.4"/>

  <!-- marble veining, lower half -->
  <g fill="none" stroke="#D9C89A" stroke-width="1.1" opacity="0.35">
    <path d="M40 150 q80 -14 150 2 q90 20 170 4"/>
    <path d="M700 168 q70 -16 140 -2 q80 16 150 2"/>
  </g>

  <!-- three columns, left -->
  <g transform="translate(60,50)">
    <g>
      <rect x="-30" y="0" width="60" height="8" fill="#EFE2C2"/>
      <rect x="-24" y="8" width="48" height="6" fill="#D9C89A"/>
      <rect x="-19" y="14" width="38" height="96" fill="#EFE2C2"/>
      <g stroke="#B49B5E" stroke-width="1.8">
        <line x1="-9" y1="16" x2="-9" y2="108"/><line x1="0" y1="16" x2="0" y2="108"/><line x1="9" y1="16" x2="9" y2="108"/>
      </g>
      <rect x="-24" y="110" width="48" height="6" fill="#D9C89A"/>
      <rect x="-30" y="116" width="60" height="8" fill="#EFE2C2"/>
    </g>
    <g transform="translate(86,14)">
      <rect x="-26" y="0" width="52" height="7" fill="#EFE2C2"/>
      <rect x="-20" y="7" width="40" height="5" fill="#D9C89A"/>
      <rect x="-16" y="12" width="32" height="84" fill="#EFE2C2"/>
      <g stroke="#B49B5E" stroke-width="1.6">
        <line x1="-7" y1="14" x2="-7" y2="94"/><line x1="7" y1="14" x2="7" y2="94"/>
      </g>
      <rect x="-20" y="96" width="40" height="5" fill="#D9C89A"/>
      <rect x="-26" y="101" width="52" height="7" fill="#EFE2C2"/>
    </g>
    <g transform="translate(162,30)">
      <rect x="-22" y="0" width="44" height="6" fill="#EFE2C2"/>
      <rect x="-17" y="6" width="34" height="4" fill="#D9C89A"/>
      <rect x="-13" y="10" width="26" height="70" fill="#EFE2C2"/>
      <line x1="0" y1="12" x2="0" y2="78" stroke="#B49B5E" stroke-width="1.6"/>
      <rect x="-17" y="80" width="34" height="4" fill="#D9C89A"/>
      <rect x="-22" y="84" width="44" height="6" fill="#EFE2C2"/>
    </g>
  </g>

  <!-- laurel wreath, center: two mirrored stem arcs with leaves set tangentially -->
  <g transform="translate(560,102)">
    <g class="breathe">
    <path d="M0 52 C-40 46 -58 18 -58 -8 C-58 -30 -46 -48 -28 -58"
          fill="none" stroke="#C7922C" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 52 C40 46 58 18 58 -8 C58 -30 46 -48 28 -58"
          fill="none" stroke="#EFE2C2" stroke-width="3" stroke-linecap="round"/>
    <g fill="#C7922C">
      <ellipse cx="-26" cy="46" rx="12" ry="4.6" transform="rotate(-155 -26 46)"/>
      <ellipse cx="-42" cy="34" rx="12" ry="4.6" transform="rotate(-128 -42 34)"/>
      <ellipse cx="-53" cy="16" rx="12" ry="4.6" transform="rotate(-105 -53 16)"/>
      <ellipse cx="-57" cy="-6" rx="12" ry="4.6" transform="rotate(-88 -57 -6)"/>
      <ellipse cx="-52" cy="-28" rx="12" ry="4.6" transform="rotate(-68 -52 -28)"/>
      <ellipse cx="-41" cy="-46" rx="12" ry="4.6" transform="rotate(-48 -41 -46)"/>
      <ellipse cx="-26" cy="-58" rx="12" ry="4.6" transform="rotate(-28 -26 -58)"/>
    </g>
    <g fill="#EFE2C2">
      <ellipse cx="26" cy="46" rx="12" ry="4.6" transform="rotate(155 26 46)"/>
      <ellipse cx="42" cy="34" rx="12" ry="4.6" transform="rotate(128 42 34)"/>
      <ellipse cx="53" cy="16" rx="12" ry="4.6" transform="rotate(105 53 16)"/>
      <ellipse cx="57" cy="-6" rx="12" ry="4.6" transform="rotate(88 57 -6)"/>
      <ellipse cx="52" cy="-28" rx="12" ry="4.6" transform="rotate(68 52 -28)"/>
      <ellipse cx="41" cy="-46" rx="12" ry="4.6" transform="rotate(48 41 -46)"/>
      <ellipse cx="26" cy="-58" rx="12" ry="4.6" transform="rotate(28 26 -58)"/>
    </g>
    <path d="M-8 52 q8 6 16 0 q-8 10 -16 0z" fill="#E0A82E"/>
    </g>
    <path class="star" d="M0 -70 l4.4 9 9.6 1.2 -7 6.8 1.8 9.6 -8.8 -4.8 -8.8 4.8 1.8 -9.6 -7 -6.8 9.6 -1.2z" fill="#E0A82E"/>
  </g>

  <!-- amphora, right of wreath -->
  <g transform="translate(800,102)">
    <path d="M-16 -44 h32 v8 h-8 q14 10 14 30 q0 26 -16 34 l4 14 h-20 l4 -14 q-16 -8 -16 -34 q0 -20 14 -30 h-8 z"
          fill="#EFE2C2" stroke="#8B661E" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-14 -32 q-20 4 -18 20 q2 12 12 12 M14 -32 q20 4 18 20 q-2 12 -12 12"
          fill="none" stroke="#8B661E" stroke-width="2.4"/>
    <path d="M-13 -6 h26 M-14 2 h28" stroke="#C7922C" stroke-width="2"/>
    <circle cx="0" cy="16" r="5" fill="#C7922C"/>
  </g>

  <!-- scroll with SPQR-style rules, far right -->
  <g transform="translate(1020,96) rotate(-6)">
    <rect x="-64" y="-38" width="128" height="76" rx="6" fill="#FAF3DF"/>
    <rect x="-64" y="-38" width="128" height="76" rx="6" fill="none" stroke="#B49B5E" stroke-width="2.2"/>
    <path d="M-64 -38 q-12 0 -12 10 v56 q0 10 12 10 z" fill="#D9C89A"/>
    <path d="M64 -38 q12 0 12 10 v56 q0 10 -12 10 z" fill="#D9C89A"/>
    <g stroke="#8B661E" stroke-width="2.2" stroke-linecap="round">
      <line x1="-46" y1="-20" x2="46" y2="-20"/>
      <line x1="-46" y1="-6" x2="34" y2="-6"/>
      <line x1="-46" y1="8" x2="46" y2="8"/>
      <line x1="-46" y1="22" x2="20" y2="22"/>
    </g>
  </g>

  <!-- gold accents -->
  <g fill="#E0A82E">
    <circle class="tw" cx="300" cy="46" r="3.4"/>
    <circle class="tw" style="animation-delay:2.1s" cx="906" cy="40" r="3"/>
  </g>

  <rect y="186" width="1200" height="4" fill="#8B661E"/>
</svg>
