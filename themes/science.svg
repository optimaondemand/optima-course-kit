<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .stars circle { animation: tw 3.4s ease-in-out infinite; }
    .stars circle:nth-of-type(2n) { animation-delay: 1.1s; }
    .stars circle:nth-of-type(3n) { animation-delay: 2.2s; }
    @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .bubs circle { animation: rise 4.2s ease-in infinite; }
    .bubs circle:nth-of-type(2) { animation-delay: 1.2s; }
    .bubs circle:nth-of-type(3) { animation-delay: 2.1s; }
    .bubs circle:nth-of-type(4) { animation-delay: 3s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0.95; } 80% { opacity: 0.5; } 100% { transform: translateY(-24px); opacity: 0; } }
    .rungs line { animation: shim 5s ease-in-out infinite; }
    .rungs line:nth-of-type(2n) { animation-delay: 1.6s; }
    .rungs line:nth-of-type(3n) { animation-delay: 3.2s; }
    @keyframes shim { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    .rms { display: none; }
    @media (prefers-reduced-motion: reduce) {
      [class] { animation: none !important; }
      .rmh { display: none; } .rms { display: inline; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#173A2E"/>
      <stop offset="1" stop-color="#F3F9F0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8DE7C"/>
      <stop offset="1" stop-color="#76C043"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- starfield -->
  <g class="stars" fill="#DFF3D2">
    <circle cx="120" cy="34" r="1.6"/><circle cx="260" cy="18" r="1.2"/><circle cx="420" cy="40" r="1.5"/>
    <circle cx="705" cy="22" r="1.3"/><circle cx="985" cy="30" r="1.6"/><circle cx="1130" cy="52" r="1.2"/>
    <circle cx="560" cy="14" r="1.2"/><circle cx="866" cy="44" r="1.4"/>
  </g>

  <!-- orbit system, right -->
  <g transform="translate(985,92)">
    <ellipse rx="120" ry="38" fill="none" stroke="#76C043" stroke-width="1.6" transform="rotate(-14)"/>
    <ellipse rx="78" ry="24" fill="none" stroke="#55C8E8" stroke-width="1.4" transform="rotate(-14)"/>
    <circle r="17" fill="#E0A82E"/>
    <circle r="17" fill="none" stroke="#F6E3B4" stroke-width="1.4" opacity="0.7"/>
    <circle class="rms" cx="72" cy="-30" r="7" fill="#76C043"/>
    <g class="rmh" transform="rotate(-14)">
      <circle r="7" fill="#76C043">
        <animateMotion dur="26s" repeatCount="indefinite" path="M120 0 A120 38 0 1 1 -120 0 A120 38 0 1 1 120 0"/>
      </circle>
    </g>
    <circle cx="-113" cy="24" r="5" fill="#55C8E8"/>
  </g>

  <!-- Erlenmeyer flask with rising bubbles -->
  <g transform="translate(205,120)">
    <path d="M-14 -58 h28 v10 l-4 4 v18 l36 54 q6 10 -6 10 h-80 q-12 0 -6 -10 l36 -54 v-18 l-4 -4 z"
          fill="none" stroke="#DFF3D2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-25.5 20 l-15 22 q-4 6 4 6 h73 q8 0 4 -6 l-15 -22 z" fill="url(#liquid)"/>
    <g class="bubs">
      <circle cx="-2" cy="4" r="4" fill="#A8DE7C"/>
      <circle cx="8" cy="-14" r="3" fill="#A8DE7C"/>
      <circle cx="-6" cy="-32" r="2.4" fill="#DFF3D2"/>
      <circle cx="4" cy="-50" r="2" fill="#DFF3D2"/>
    </g>
  </g>

  <!-- molecule: hexagon bonds -->
  <g transform="translate(475,84)">
    <g fill="none" stroke="#8FD65E" stroke-width="2">
      <path d="M0 -44 L38 -22 L38 22 L0 44 L-38 22 L-38 -22 Z"/>
      <path d="M38 -22 L82 -44 M38 22 L82 44"/>
    </g>
    <g fill="#F3F9F0" stroke="#4C7C2B" stroke-width="2">
      <circle cx="0" cy="-44" r="7"/><circle cx="38" cy="-22" r="7"/><circle cx="38" cy="22" r="7"/>
      <circle cx="0" cy="44" r="7"/><circle cx="-38" cy="22" r="7"/><circle cx="-38" cy="-22" r="7"/>
    </g>
    <circle cx="82" cy="-44" r="8" fill="#E0A82E"/>
    <circle cx="82" cy="44" r="8" fill="#55C8E8"/>
  </g>

  <!-- DNA strand, center-right -->
  <g transform="translate(680,96)" fill="none" stroke-linecap="round">
    <path d="M0 -60 C24 -40 24 -20 0 0 C-24 20 -24 40 0 60" stroke="#76C043" stroke-width="3"/>
    <path d="M0 -60 C-24 -40 -24 -20 0 0 C24 20 24 40 0 60" stroke="#DFF3D2" stroke-width="3"/>
    <g class="rungs" stroke="#8FD65E" stroke-width="2">
      <line x1="-14" y1="-45" x2="14" y2="-45"/>
      <line x1="-17" y1="-30" x2="17" y2="-30"/>
      <line x1="-10" y1="-15" x2="10" y2="-15"/>
      <line x1="-10" y1="15" x2="10" y2="15"/>
      <line x1="-17" y1="30" x2="17" y2="30"/>
      <line x1="-14" y1="45" x2="14" y2="45"/>
    </g>
  </g>

  <!-- sprouting leaf, bottom-left grounding -->
  <g transform="translate(345,168)">
    <path d="M0 0 Q-2 -22 0 -34" fill="none" stroke="#4C7C2B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 -20 Q-20 -26 -26 -44 Q-6 -42 0 -26 Z" fill="#76C043"/>
    <path d="M0 -26 Q16 -34 26 -50 Q4 -48 -1 -32 Z" fill="#A8DE7C"/>
  </g>

  <rect y="186" width="1200" height="4" fill="#4C7C2B"/>
</svg>
