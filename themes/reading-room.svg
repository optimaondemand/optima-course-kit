<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .glow { animation: glow 5.5s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
    .lamp { animation: lamp 5.5s ease-in-out infinite; }
    @keyframes lamp { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
    .dust circle { animation: mote 6s ease-in-out infinite; }
    .dust circle:nth-of-type(2) { animation-delay: 1.2s; }
    .dust circle:nth-of-type(3) { animation-delay: 2.4s; }
    .dust circle:nth-of-type(4) { animation-delay: 3.6s; }
    .dust circle:nth-of-type(5) { animation-delay: 4.8s; }
    @keyframes mote { 0%,100% { transform: translateY(0); opacity: 0.8; } 50% { transform: translateY(-9px); opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#1E3B2E"/>
      <stop offset="1" stop-color="#F0F7F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0C982" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F0C982" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- shelf of spines, left -->
  <g transform="translate(60,150)">
    <g>
      <rect x="0" y="-92" width="24" height="92" rx="3" fill="#EFE9D8"/>
      <rect x="28" y="-76" width="18" height="76" rx="3" fill="#3B7D5D"/>
      <rect x="50" y="-84" width="22" height="84" rx="3" fill="#C7922C"/>
      <rect x="76" y="-70" width="16" height="70" rx="3" fill="#8FC9AC"/>
      <rect x="96" y="-88" width="20" height="88" rx="3" fill="#40536B"/>
      <!-- leaning spine -->
      <rect x="126" y="-80" width="18" height="82" rx="3" fill="#EFE9D8" transform="rotate(9 135 -40)"/>
      <rect x="156" y="-66" width="16" height="66" rx="3" fill="#3B7D5D"/>
    </g>
    <g fill="none" stroke="#0E1C42" stroke-width="2" opacity="0.35">
      <path d="M6 -78 h12 M6 -70 h12"/>
      <path d="M55 -68 h12 M55 -60 h12"/>
      <path d="M101 -72 h10"/>
    </g>
    <rect x="-16" y="0" width="204" height="9" rx="3" fill="#B78D5E"/>
  </g>

  <!-- lamp glow -->
  <ellipse class="glow" cx="520" cy="94" rx="190" ry="110" fill="url(#glow)"/>

  <!-- book stack with banker's lamp -->
  <g transform="translate(500,150)">
    <rect x="-78" y="-16" width="156" height="16" rx="4" fill="#3B7D5D"/>
    <rect x="-64" y="-30" width="132" height="14" rx="4" fill="#EFE9D8"/>
    <rect x="-70" y="-44" width="118" height="14" rx="4" fill="#C7922C"/>
    <g fill="none" stroke="#0E1C42" stroke-width="1.6" opacity="0.3">
      <path d="M-60 -8 h120 M-50 -23 h100 M-56 -37 h92"/>
    </g>
    <!-- banker's lamp: brass base and stem, long green half-cylinder shade -->
    <g transform="translate(0,-44)">
      <rect x="-24" y="-7" width="48" height="7" rx="3.5" fill="#C7922C"/>
      <path d="M0 -7 V-34" stroke="#C7922C" stroke-width="5"/>
      <circle cy="-36" r="4" fill="#C7922C"/>
      <path d="M-46 -30 L-40 -46 Q0 -58 40 -46 L46 -30 Q0 -40 -46 -30 Z"
            fill="#2E6B4F" stroke="#8FC9AC" stroke-width="2" stroke-linejoin="round"/>
      <path class="lamp" d="M-46 -30 Q0 -40 46 -30 Q0 -25 -46 -30 Z" fill="#F0C982"/>
    </g>
    <!-- reading glasses beside the stack -->
    <g transform="translate(122,-8)" fill="none" stroke="#EFE9D8" stroke-width="2.6">
      <circle cx="-14" cy="0" r="11"/>
      <circle cx="14" cy="0" r="11"/>
      <path d="M-3 -2 Q0 -6 3 -2 M-25 -3 l-10 -6 M25 -3 l10 -6"/>
    </g>
  </g>

  <!-- rolling ladder, right -->
  <g transform="translate(950,40)" stroke="#C29A6B" stroke-width="6" stroke-linecap="round">
    <line x1="0" y1="0" x2="-34" y2="132"/>
    <line x1="44" y1="0" x2="10" y2="132"/>
    <g stroke-width="4.6">
      <line x1="5" y1="22" x2="47" y2="22"/>
      <line x1="-2" y1="50" x2="40" y2="50"/>
      <line x1="-9" y1="78" x2="33" y2="78"/>
      <line x1="-16" y1="106" x2="26" y2="106"/>
    </g>
  </g>
  <circle cx="-34" cy="176" r="6" transform="translate(950,0)" fill="#8A6A44"/>
  <circle cx="10" cy="176" r="6" transform="translate(950,0)" fill="#8A6A44"/>

  <!-- faint far shelf, right of ladder -->
  <g transform="translate(1030,150)" opacity="0.6">
    <rect x="0" y="-64" width="18" height="64" rx="3" fill="#8FC9AC"/>
    <rect x="22" y="-74" width="20" height="74" rx="3" fill="#EFE9D8"/>
    <rect x="46" y="-58" width="15" height="58" rx="3" fill="#3B7D5D"/>
    <rect x="65" y="-68" width="18" height="68" rx="3" fill="#C7922C"/>
    <rect x="87" y="-52" width="14" height="52" rx="3" fill="#40536B"/>
    <rect x="105" y="-62" width="17" height="62" rx="3" fill="#EFE9D8"/>
    <rect x="-10" y="0" width="146" height="8" rx="3" fill="#B78D5E"/>
  </g>

  <!-- open book resting mid-scene -->
  <g transform="translate(760,144)">
    <path d="M0 -8 Q-30 -22 -62 -16 L-62 8 Q-30 -2 0 10 Z" fill="#EFE9D8"/>
    <path d="M0 -8 Q30 -22 62 -16 L62 8 Q30 -2 0 10 Z" fill="#FBFAF4"/>
    <path d="M0 -8 Q-30 -22 -62 -16 M0 -8 Q30 -22 62 -16 M0 -8 V10" fill="none" stroke="#2E6B4F" stroke-width="2"/>
  </g>

  <!-- dust motes in the glow -->
  <g class="dust" fill="#F0C982">
    <circle cx="420" cy="60" r="2"/><circle cx="560" cy="46" r="1.6"/><circle cx="610" cy="92" r="1.4"/>
    <circle cx="470" cy="34" r="1.3"/><circle cx="380" cy="100" r="1.5"/>
  </g>

  <rect y="186" width="1200" height="4" fill="#3B7D5D"/>
</svg>
