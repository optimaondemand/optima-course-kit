<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .run { animation: run 5s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -1720; } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
    @keyframes beat { 0%,40%,100% { transform: scale(1); } 10% { transform: scale(1.08); } 22% { transform: scale(1.03); } }
    .streaks line { animation: whoosh 2.6s ease-in-out infinite; }
    .streaks line:nth-of-type(2) { animation-delay: 0.5s; }
    .streaks line:nth-of-type(3) { animation-delay: 1.1s; }
    @keyframes whoosh { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    .glint { animation: glint 4s ease-in-out infinite; }
    @keyframes glint { 0%,80%,100% { opacity: 1; } 90% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#5A3414"/>
      <stop offset="1" stop-color="#FFF6EC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- heartbeat trace across the full banner -->
  <path d="M-20 96 H210 L232 96 244 64 262 128 280 84 292 96 H436 L458 96 470 58 490 136 508 78 520 96 H860 L882 96 894 68 912 124 930 86 942 96 H1220"
        fill="none" stroke="#FFB25E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a bright pulse traveling the trace -->
  <path class="run" d="M-20 96 H210 L232 96 244 64 262 128 280 84 292 96 H436 L458 96 470 58 490 136 508 78 520 96 H860 L882 96 894 68 912 124 930 86 942 96 H1220"
        fill="none" stroke="#FFF6EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="90 1630" opacity="0.9"/>
  <circle cx="292" cy="96" r="4" fill="#FFD9AC"/>
  <circle cx="520" cy="96" r="4" fill="#FFD9AC"/>

  <!-- runner, pictogram style: far-side limbs first, then torso and head,
       then near-side limbs, so the figure reads with depth -->
  <g transform="translate(660,92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- far arm, swinging back -->
    <path d="M22 -36 L-2 -28 L-18 -14" stroke="#F78F1E" stroke-width="9"/>
    <!-- far leg, extended behind on the push-off -->
    <path d="M0 0 L-22 18 L-44 32" stroke="#F78F1E" stroke-width="10"/>
    <path d="M-44 32 L-55 37" stroke="#E0A82E" stroke-width="9"/>
    <!-- torso, one stroke leaning into the stride -->
    <path d="M26 -40 C22 -26 12 -12 0 0" stroke="#FFF6EC" stroke-width="13"/>
    <circle cx="32" cy="-52" r="12" fill="#FFF6EC" stroke="none"/>
    <!-- near leg, knee driving forward -->
    <path d="M0 0 L28 10 L22 36" stroke="#F78F1E" stroke-width="10"/>
    <path d="M22 36 L34 38" stroke="#E0A82E" stroke-width="9"/>
    <!-- near arm, pumping up in front -->
    <path d="M22 -36 L44 -24 L58 -38" stroke="#F78F1E" stroke-width="9"/>
  </g>
  <!-- speed streaks behind the runner -->
  <g class="streaks" stroke="#FFB25E" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="536" y1="52" x2="586" y2="52"/>
    <line x1="516" y1="70" x2="580" y2="70"/>
    <line x1="540" y1="130" x2="596" y2="130"/>
  </g>

  <!-- heart with pulse, left -->
  <g transform="translate(160,84)">
    <g class="beat">
      <path d="M0 42 C-38 16 -52 -8 -44 -28 C-38 -44 -16 -48 0 -30 C16 -48 38 -44 44 -28 C52 -8 38 16 0 42 Z"
            fill="#F78F1E" stroke="#FFD9AC" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-26 -2 H-12 L-6 -14 L4 12 L10 -2 H26" fill="none" stroke="#FFF6EC" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- water bottle and apple, grounding the right -->
  <g transform="translate(950,120)">
    <rect x="-14" y="-44" width="28" height="66" rx="9" fill="none" stroke="#FFD9AC" stroke-width="3"/>
    <rect x="-8" y="-56" width="16" height="12" rx="3" fill="#E0A82E"/>
    <path d="M-14 -8 q14 -8 28 0 v22 q0 8 -8 8 h-12 q-8 0 -8 -8 z" fill="#FFB25E" opacity="0.75"/>
  </g>
  <g transform="translate(1030,128)">
    <circle cx="0" cy="6" r="24" fill="#F78F1E"/>
    <path d="M-10 4 a12 12 0 0 1 -8 -14" fill="none" stroke="#FFF6EC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M0 -16 q-2 -10 4 -16" fill="none" stroke="#8B5B2B" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M4 -20 q14 -10 22 2 q-14 8 -22 -2z" fill="#76C043"/>
  </g>

  <!-- medal, upper right -->
  <g transform="translate(1130,54)">
    <path d="M-10 -34 L0 -12 L10 -34" fill="none" stroke="#FFB25E" stroke-width="6" stroke-linecap="round"/>
    <circle cy="6" r="18" fill="#E0A82E"/>
    <circle cy="6" r="18" fill="none" stroke="#FFF6EC" stroke-width="2.4"/>
    <path class="glint" d="M0 -2 l2.6 5.4 6 0.7 -4.5 4 1.3 5.9 -5.4 -3.1 -5.4 3.1 1.3 -5.9 -4.5 -4 6 -0.7z" fill="#FFF6EC"/>
  </g>

  <rect y="186" width="1200" height="4" fill="#F78F1E"/>
</svg>
