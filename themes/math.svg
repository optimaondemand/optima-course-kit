<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .pts circle { animation: pt 3.2s ease-in-out infinite; }
    .pts circle:nth-of-type(2) { animation-delay: 1s; }
    .pts circle:nth-of-type(3) { animation-delay: 2s; }
    @keyframes pt { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .dash { animation: dash 6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -54; } }
    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 22s linear infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .plot { animation: plot 7s linear infinite; }
    @keyframes plot { to { stroke-dashoffset: -70; } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#16305E"/>
      <stop offset="1" stop-color="#F2F6FC"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBAF0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FBAF0" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8FBAF0" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>
  <rect width="1200" height="190" fill="url(#grid)" opacity="0.22"/>

  <!-- axes with a plotted parabola: y = x^2 -->
  <g transform="translate(180,158)">
    <line x1="-140" y1="0" x2="330" y2="0" stroke="#DCE9FB" stroke-width="2"/>
    <line x1="0" y1="16" x2="0" y2="-136" stroke="#DCE9FB" stroke-width="2"/>
    <path d="M330 0l-12 -6v12z M0 -136l-6 12h12z" fill="#DCE9FB"/>
    <path d="M-130 -112 Q -65 108 0 0 T 130 -112" fill="none" stroke="#55C8E8" stroke-width="3.5" stroke-linecap="round"/>
    <g class="pts" fill="#E0A82E">
      <circle cx="-65" cy="-28" r="5"/>
      <circle cx="65" cy="-28" r="5"/>
      <circle cx="0" cy="0" r="5"/>
    </g>
    <g stroke="#8FBAF0" stroke-width="1.2" stroke-dasharray="4 5" fill="none">
      <path class="dash" d="M-65 -28H0 M65 -28H0"/>
    </g>
  </g>

  <!-- compass construction: circle, radius, inscribed hexagon -->
  <g transform="translate(700,96)">
    <circle r="62" fill="none" stroke="#3D7DD8" stroke-width="2.5"/>
    <circle r="62" fill="url(#fade)" opacity="0.35"/>
    <path d="M62 0L31 53.7L-31 53.7L-62 0L-31 -53.7L31 -53.7Z" fill="none" stroke="#DCE9FB" stroke-width="1.8"/>
    <g class="sweep"><line x1="0" y1="0" x2="62" y2="0" stroke="#E0A82E" stroke-width="2.2"/></g>
    <circle r="4" fill="#E0A82E"/>
    <g stroke="#8FBAF0" stroke-width="1.4">
      <line x1="66" y1="0" x2="74" y2="0"/><line x1="-66" y1="0" x2="-74" y2="0"/>
      <line x1="0" y1="66" x2="0" y2="74"/><line x1="0" y1="-66" x2="0" y2="-74"/>
    </g>
  </g>

  <!-- golden-ratio rectangles and spiral -->
  <g transform="translate(905,38)" fill="none">
    <rect width="144" height="89" stroke="#8FBAF0" stroke-width="1.5"/>
    <rect width="89" height="89" stroke="#8FBAF0" stroke-width="1.5"/>
    <rect x="89" width="55" height="55" stroke="#8FBAF0" stroke-width="1.5"/>
    <rect x="89" y="55" width="34" height="34" stroke="#8FBAF0" stroke-width="1.5"/>
    <path d="M0 89 A89 89 0 0 1 89 0 A55 55 0 0 1 144 55 A34 34 0 0 1 110 89 A21 21 0 0 1 89 68"
          stroke="#55C8E8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- right triangle with its square-angle mark -->
  <g transform="translate(430,150)">
    <path d="M0 0L118 0L118 -74Z" fill="none" stroke="#DCE9FB" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M104 0V-14H118" fill="none" stroke="#E0A82E" stroke-width="2"/>
    <circle cx="0" cy="0" r="3.5" fill="#55C8E8"/>
    <circle cx="118" cy="-74" r="3.5" fill="#55C8E8"/>
  </g>

  <!-- scattered plotted points, right side -->
  <g fill="#3D7DD8">
    <circle cx="1058" cy="152" r="4"/>
    <circle cx="1105" cy="130" r="3"/>
    <circle cx="1148" cy="148" r="3.5"/>
    <circle cx="1088" cy="166" r="2.5"/>
  </g>
  <path class="plot" d="M1058 152L1105 130L1148 148" fill="none" stroke="#8FBAF0" stroke-width="1.4" stroke-dasharray="3 4"/>

  <rect y="186" width="1200" height="4" fill="#3D7DD8"/>
</svg>
