<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .note { animation: bob 3.6s ease-in-out infinite; }
    .note.n2 { animation-delay: 1.2s; }
    .note.n3 { animation-delay: 2.4s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .eq rect { transform-box: fill-box; transform-origin: center bottom; animation: eq 1.6s ease-in-out infinite; }
    .eq rect:nth-of-type(2) { animation-delay: 0.25s; }
    .eq rect:nth-of-type(3) { animation-delay: 0.5s; }
    .eq rect:nth-of-type(4) { animation-delay: 0.75s; }
    .eq rect:nth-of-type(5) { animation-delay: 1s; }
    @keyframes eq { 0%,100% { transform: scaleY(0.55); } 50% { transform: scaleY(1.15); } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#3A2360"/>
      <stop offset="1" stop-color="#F7F3FB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- sweeping five-line staff -->
  <g fill="none" stroke="#B99CD6" stroke-width="1.8" opacity="0.9">
    <path d="M-20 60 C300 20 640 118 1220 58"/>
    <path d="M-20 74 C300 34 640 132 1220 72"/>
    <path d="M-20 88 C300 48 640 146 1220 86"/>
    <path d="M-20 102 C300 62 640 160 1220 100"/>
    <path d="M-20 116 C300 76 640 174 1220 114"/>
  </g>

  <!-- treble clef, drawn as strokes -->
  <g transform="translate(120,88)" fill="none" stroke="#E8DCF5" stroke-linecap="round">
    <path d="M0 44 C-20 44 -26 24 -12 14 C4 3 18 16 12 32 C6 47 -12 52 -16 66 C-19 76 -12 84 -2 84 C8 84 12 76 10 68"
          stroke-width="4"/>
    <path d="M-2 84 C-6 62 -2 20 6 -18 C10 -36 2 -44 -4 -36 C-10 -28 -6 -10 0 6" stroke-width="4"/>
    <circle cx="-16" cy="66" r="1" stroke-width="4"/>
  </g>

  <!-- beamed eighth notes riding the staff -->
  <g fill="#F7F3FB">
    <g transform="translate(430,64)">
      <g class="note">
        <ellipse rx="11" ry="8" transform="rotate(-18)"/>
        <rect x="8" y="-58" width="3.4" height="58" rx="1.6"/>
        <g transform="translate(118,18)">
          <ellipse rx="11" ry="8" transform="rotate(-18)"/>
          <rect x="8" y="-76" width="3.4" height="76" rx="1.6"/>
        </g>
        <path d="M8 -58 L129.4 -58 L129.4 -47 L8 -47 Z"/>
      </g>
    </g>
    <g transform="translate(700,132)">
      <g class="note n2">
        <ellipse rx="11" ry="8" transform="rotate(-18)"/>
        <rect x="8" y="-60" width="3.4" height="60" rx="1.6"/>
        <path d="M11.4 -60 q22 8 24 30 q-4 -12 -24 -14 z"/>
      </g>
    </g>
  </g>
  <!-- a gold whole note -->
  <g transform="translate(560,86)">
    <g class="note n3">
      <ellipse rx="12" ry="8.6" transform="rotate(-18)" fill="#E0A82E"/>
      <ellipse rx="5.4" ry="3" transform="rotate(-40)" fill="#3A2360"/>
    </g>
  </g>

  <!-- piano keys, bottom right -->
  <g transform="translate(896,132)">
    <rect x="0" y="0" width="284" height="54" rx="5" fill="#F1E9FA"/>
    <g stroke="#8B5CB8" stroke-width="1.6">
      <line x1="40.5" y1="0" x2="40.5" y2="54"/><line x1="81" y1="0" x2="81" y2="54"/>
      <line x1="121.5" y1="0" x2="121.5" y2="54"/><line x1="162" y1="0" x2="162" y2="54"/>
      <line x1="202.5" y1="0" x2="202.5" y2="54"/><line x1="243" y1="0" x2="243" y2="54"/>
    </g>
    <g fill="#2B1A45">
      <rect x="27" y="0" width="22" height="32" rx="2"/><rect x="68" y="0" width="22" height="32" rx="2"/>
      <rect x="149" y="0" width="22" height="32" rx="2"/><rect x="190" y="0" width="22" height="32" rx="2"/>
      <rect x="230" y="0" width="22" height="32" rx="2"/>
    </g>
    <rect x="0" y="0" width="284" height="54" rx="5" fill="none" stroke="#8B5CB8" stroke-width="2"/>
  </g>

  <!-- sound-wave bars, upper right -->
  <g class="eq" transform="translate(1000,44)" fill="#B99CD6">
    <rect x="0" y="-12" width="5" height="24" rx="2.5"/>
    <rect x="12" y="-20" width="5" height="40" rx="2.5" fill="#E0A82E"/>
    <rect x="24" y="-8" width="5" height="16" rx="2.5"/>
    <rect x="36" y="-16" width="5" height="32" rx="2.5"/>
    <rect x="48" y="-6" width="5" height="12" rx="2.5"/>
  </g>

  <rect y="186" width="1200" height="4" fill="#8B5CB8"/>
</svg>
