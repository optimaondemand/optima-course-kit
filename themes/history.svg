<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="">
  <style>
    .rose { transform-box: fill-box; transform-origin: center; animation: rose 36s linear infinite; }
    @keyframes rose { to { transform: rotate(360deg); } }
    .ring { animation: ring 3.6s ease-in-out infinite; }
    @keyframes ring { 0%,100% { opacity: 0.55; } 50% { opacity: 0.15; } }
    .sandT { animation: sandT 7s ease-in-out infinite alternate; }
    @keyframes sandT { from { opacity: 1; } to { opacity: 0.35; } }
    .sandB { animation: sandB 7s ease-in-out infinite alternate; }
    @keyframes sandB { from { opacity: 0.55; } to { opacity: 1; } }
    .stream { stroke-dasharray: 2 3; animation: stream 1.6s linear infinite; }
    @keyframes stream { to { stroke-dashoffset: -10; } }
    .laurel { transform-box: fill-box; transform-origin: left bottom; animation: laurel 6s ease-in-out infinite; }
    @keyframes laurel { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { [class] { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1C42"/>
      <stop offset="0.55" stop-color="#4B3120"/>
      <stop offset="1" stop-color="#FAF5EC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <!-- faded map contours -->
  <g fill="none" stroke="#E5C9A8" stroke-width="1.1" opacity="0.28">
    <path d="M640 12 q90 26 150 8 q80 -22 130 6 q60 34 130 18"/>
    <path d="M600 44 q110 34 190 12 q90 -24 150 10 q70 40 170 22"/>
    <path d="M700 156 q80 -18 150 2 q80 24 140 8"/>
  </g>

  <!-- ionic column, left -->
  <g transform="translate(120,52)">
    <rect x="-44" y="-24" width="88" height="10" rx="3" fill="#EAD9BF"/>
    <rect x="-38" y="-14" width="76" height="8" fill="#D9BE97"/>
    <g fill="none" stroke="#EAD9BF" stroke-width="4">
      <path d="M-36 -8 a10 10 0 1 0 -0.1 0"/>
      <path d="M36 -8 a10 10 0 1 0 -0.1 0"/>
    </g>
    <rect x="-27" y="-4" width="54" height="108" fill="#EAD9BF"/>
    <g stroke="#B08A56" stroke-width="2">
      <line x1="-14" y1="0" x2="-14" y2="104"/><line x1="0" y1="0" x2="0" y2="104"/><line x1="14" y1="0" x2="14" y2="104"/>
    </g>
    <rect x="-34" y="104" width="68" height="9" fill="#D9BE97"/>
    <rect x="-42" y="113" width="84" height="10" rx="2" fill="#EAD9BF"/>
  </g>

  <!-- timeline running the banner's length -->
  <g transform="translate(0,124)">
    <line x1="210" y1="0" x2="1160" y2="0" stroke="#E5C9A8" stroke-width="2.4"/>
    <path d="M1160 0l-14 -7v14z" fill="#E5C9A8"/>
    <g>
      <circle cx="300" cy="0" r="7" fill="#C77A3B"/>
      <circle class="ring" cx="300" cy="0" r="11" fill="none" stroke="#C77A3B" stroke-width="1.6"/>
      <line x1="300" y1="-10" x2="300" y2="-34" stroke="#E5C9A8" stroke-width="1.6"/>
      <rect x="284" y="-56" width="32" height="22" rx="3" fill="none" stroke="#E5C9A8" stroke-width="1.6"/>
    </g>
    <g>
      <circle cx="520" cy="0" r="7" fill="#E0A82E"/>
      <circle class="ring" style="animation-delay:0.9s" cx="520" cy="0" r="11" fill="none" stroke="#E0A82E" stroke-width="1.6"/>
      <line x1="520" y1="10" x2="520" y2="30" stroke="#E5C9A8" stroke-width="1.6"/>
      <circle cx="520" cy="38" r="7" fill="none" stroke="#E5C9A8" stroke-width="1.6"/>
    </g>
    <g>
      <circle cx="760" cy="0" r="7" fill="#C77A3B"/>
      <circle class="ring" style="animation-delay:1.8s" cx="760" cy="0" r="11" fill="none" stroke="#C77A3B" stroke-width="1.6"/>
      <line x1="760" y1="-10" x2="760" y2="-30" stroke="#E5C9A8" stroke-width="1.6"/>
      <path d="M752 -30 h16 l-4 -8 4 -8 h-16 z" fill="#E0A82E"/>
    </g>
    <circle cx="980" cy="0" r="7" fill="#E0A82E"/>
    <circle class="ring" style="animation-delay:2.7s" cx="980" cy="0" r="11" fill="none" stroke="#E0A82E" stroke-width="1.6"/>
  </g>

  <!-- hourglass -->
  <g transform="translate(1078,74)">
    <g fill="none" stroke="#EAD9BF" stroke-width="3" stroke-linejoin="round">
      <path d="M-24 -34 h48 M-24 34 h48"/>
      <path d="M-19 -32 C-19 -12 -6 -8 -2 0 C-6 8 -19 12 -19 32 M19 -32 C19 -12 6 -8 2 0 C6 8 19 12 19 32"/>
    </g>
    <path class="sandT" d="M-11 -26 C-11 -14 -4 -9 0 -3 C4 -9 11 -14 11 -26 Z" fill="#E0A82E"/>
    <path class="sandB" d="M-14 30 C-14 20 -4 16 0 8 C4 16 14 20 14 30 Z" fill="#E0A82E"/>
    <line class="stream" x1="0" y1="-2" x2="0" y2="26" stroke="#E0A82E" stroke-width="2"/>
  </g>

  <!-- laurel sprig, center-left -->
  <g transform="translate(388,64)">
    <g class="laurel">
    <path d="M0 40 Q-4 4 18 -28" fill="none" stroke="#C77A3B" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#E5C9A8">
      <ellipse cx="-2" cy="22" rx="12" ry="4.6" transform="rotate(-52 -2 22)"/>
      <ellipse cx="2" cy="6" rx="12" ry="4.6" transform="rotate(-44 2 6)"/>
      <ellipse cx="8" cy="-9" rx="12" ry="4.6" transform="rotate(-34 8 -9)"/>
      <ellipse cx="15" cy="-22" rx="11" ry="4.2" transform="rotate(-22 15 -22)"/>
    </g>
    <g fill="#C77A3B">
      <ellipse cx="8" cy="28" rx="11" ry="4.2" transform="rotate(-18 8 28)"/>
      <ellipse cx="13" cy="12" rx="11" ry="4.2" transform="rotate(-8 13 12)"/>
      <ellipse cx="19" cy="-3" rx="10" ry="4" transform="rotate(4 19 -3)"/>
    </g>
    </g>
  </g>

  <!-- compass rose fragment, upper middle -->
  <g transform="translate(560,42)" opacity="0.85">
    <circle r="17" fill="none" stroke="#E5C9A8" stroke-width="1.6"/>
    <g class="rose"><path d="M0 -26 L5 -5 L26 0 L5 5 L0 26 L-5 5 L-26 0 L-5 -5 Z" fill="#E0A82E"/></g>
  </g>

  <rect y="186" width="1200" height="4" fill="#C77A3B"/>
</svg>
